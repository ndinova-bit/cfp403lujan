<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preinscripción · CFP N.º 403 Luján</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#071B38">
  <link rel="icon" type="image/png" sizes="32x32" href="img/app/favicon-32.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ficha-inscripcion.css?v=1">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eef2f8; color: #14213d; font-family: 'Inter', system-ui, sans-serif; line-height: 1.45; }
    header.pi-cab { background: #071b38; color: #fff; padding: 1rem; display: flex; align-items: center; gap: .9rem; justify-content: center; }
    header.pi-cab img { width: 58px; height: 58px; }
    header.pi-cab h1 { font-size: 1.15rem; margin: 0; }
    header.pi-cab p { margin: .1rem 0 0; font-size: .82rem; opacity: .85; }
    main { max-width: 980px; margin: 0 auto; padding: 1rem; }
    .pi-card { background: #fff; border: 1px solid #d5dbe6; border-radius: 16px; padding: 1.1rem 1.2rem; margin-bottom: 1rem; }
    .pi-card h2 { margin: 0 0 .4rem; font-size: 1.05rem; }
    .pi-nota { font-size: .85rem; color: #44506a; margin: .3rem 0 0; }
    .pi-info { background: #eaf3ff; border-radius: 10px; padding: .6rem .8rem; font-size: .86rem; margin-top: .6rem; }
    .pi-aviso { font-weight: 700; font-size: .95rem; }
    .pi-btn { appearance: none; border: 0; border-radius: 10px; padding: .75rem 1.2rem; font: inherit; font-weight: 700; font-size: .95rem; cursor: pointer; background: #2563eb; color: #fff; }
    .pi-btn.sec { background: #fff; color: #14213d; border: 1px solid #b8c1d1; }
    .pi-btn:disabled { opacity: .6; cursor: wait; }
    .pi-acciones { display: flex; flex-wrap: wrap; gap: .6rem; margin-top: .9rem; }
    .pi-ok { text-align: center; }
    .pi-ok .pi-num { font-size: 1.6rem; font-weight: 800; letter-spacing: .02em; color: #071b38; margin: .3rem 0; }
    .pi-hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .pi-consent { display: flex; gap: .6rem; align-items: flex-start; font-size: .86rem; }
    .pi-consent input { margin-top: .2rem; width: 1.1rem; height: 1.1rem; }
  </style>
</head>
<body>
  <header class="pi-cab">
    <img src="logo.png" alt="Logo del CFP N.º 403">
    <div><h1>Preinscripción · CFP N.º 403</h1><p>Centro de Formación Profesional · Luján</p></div>
  </header>
  <main id="pi-raiz"><div class="pi-card"><p>Cargando…</p></div></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/ficha_inscripcion.js?v=2"></script>
  <script src="js/preinscripcion.js?v=2"></script>
</body>
</html>
